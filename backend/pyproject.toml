[project]
name = "atalaia"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "geoalchemy2>=0.15",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "jsonschema>=4.22",
  "apscheduler>=3.10,<4",
  "anthropic>=0.40",
  "httpx>=0.27",
  "faker>=26",
  "shapely>=2.0",
  "python-multipart>=0.0.9",
  "redis>=5.0",
  "tzdata>=2024.1",
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
